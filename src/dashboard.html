<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA // COLONY</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

:root {
  --bg: #0a0a1a;
  --green: #00ee77;
  --green-dim: rgba(0,238,119,0.4);
  --green-dark: #003322;
  --amber: #ffaa00;
  --red: #ff3344;
  --blue: #4488ff;
  --purple: #cc66ff;
  --white: #ddeeff;
  --font: 'Press Start 2P', monospace;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: var(--font);
  overflow: hidden;
}

/* pixel grid background */
#grid-bg {
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,238,119,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,238,119,0.04) 1px, transparent 1px);
  background-size: 16px 16px;
  z-index: 0;
  pointer-events: none;
}

/* CRT scanline overlay */
#scanlines {
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.12) 3px,
    rgba(0,0,0,0.12) 4px
  );
  z-index: 100;
  pointer-events: none;
}

/* creature layer */
#world {
  position: fixed; inset: 0;
  z-index: 5;
  pointer-events: none;
}

/* GAIA top-center zone */
#gaia-zone {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}

#gaia-sprite {
  animation: gaiaBoB 2s ease-in-out infinite;
  display: block;
}

@keyframes gaiaBoB {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-8px); }
}

#gaia-name {
  font-size: 10px;
  color: var(--green);
  text-shadow: 0 0 10px var(--green), 0 0 20px var(--green);
  letter-spacing: 3px;
  margin-top: 2px;
}

.gaia-stat-line {
  font-size: 6px;
  color: var(--green-dim);
  letter-spacing: 1px;
}

.gaia-stat-line span {
  color: var(--green);
}

/* HUD overlay */
#hud {
  position: fixed; inset: 0;
  z-index: 10;
  pointer-events: none;
}

.pixel-panel {
  background: rgba(4,4,14,0.92);
  border: 2px solid var(--green);
  padding: 8px 10px;
  box-shadow: 3px 3px 0 rgba(0,238,119,0.25);
}

/* GEN counter — top center */
#gen-display {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
}

#gen-number {
  font-size: 20px;
  color: var(--green);
  text-shadow:
    0 0 8px var(--green),
    0 0 16px var(--green),
    2px 2px 0 #003322;
  letter-spacing: 4px;
}

/* Top-left stats */
#stats-left {
  position: absolute;
  top: 14px; left: 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.stat-row {
  font-size: 6px;
  color: rgba(0,238,119,0.6);
  display: flex;
  gap: 10px;
  justify-content: space-between;
}
.stat-row .val {
  color: var(--white);
}

/* Top-right stats */
#stats-right {
  position: absolute;
  top: 14px; right: 14px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: right;
}

/* Balance — bottom right above event log */
#balance-box {
  position: absolute;
  bottom: 90px; right: 14px;
  text-align: right;
  min-width: 148px;
}

#balance-amount {
  font-size: 14px;
  color: var(--green);
  text-shadow: 0 0 8px var(--green), 2px 2px 0 #003322;
}

#balance-label {
  font-size: 5px;
  color: rgba(0,238,119,0.4);
  margin-top: 4px;
  letter-spacing: 2px;
}

#bal-breakdown {
  margin-top: 7px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.bal-row {
  font-size: 5px;
  color: rgba(0,238,119,0.45);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.bal-row .bv {
  color: var(--white);
}

.bal-row.bal-null .bv {
  color: rgba(200,220,255,0.25);
}

.bal-divider {
  border-top: 1px solid #003322;
  margin: 2px 0;
}

/* Event log — bottom ticker */
#event-log {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: rgba(0,0,0,0.85);
  border-top: 2px solid var(--green);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 6px 10px;
  gap: 3px;
  overflow: hidden;
}

#event-log-title {
  position: absolute;
  top: 6px; left: 10px;
  font-size: 5px;
  color: rgba(0,238,119,0.35);
  letter-spacing: 2px;
}

.log-line {
  font-size: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 1px 0 1px 6px;
  animation: logIn 0.25s ease-out;
}
.log-line.danger  { color: #ff7788; border-left: 2px solid var(--red); }
.log-line.success { color: #66ffaa; border-left: 2px solid var(--green); }
.log-line.warn    { color: #ffcc55; border-left: 2px solid var(--amber); }
.log-line.info    { color: #66aaff; border-left: 2px solid var(--blue); }

@keyframes logIn {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* Child creature wrappers */
.creature-wrap {
  position: fixed;
  pointer-events: auto;
  cursor: pointer;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.creature-sprite {
  display: block;
  image-rendering: pixelated;
}

/* pixel health bar */
.hp-bar-bg {
  width: 32px;
  height: 4px;
  background: #111122;
  border: 1px solid rgba(255,255,255,0.15);
  margin-bottom: 2px;
  margin-top: -4px;
}
.hp-bar-fill {
  height: 100%;
  background: var(--green);
  transition: width 2s linear, background 1s;
}
.hp-bar-fill.med  { background: var(--amber); }
.hp-bar-fill.low  { background: var(--red); }

.creature-id {
  font-size: 4px;
  color: rgba(200,220,255,0.4);
  text-align: center;
  max-width: 64px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* spawn pop */
@keyframes spawnPop {
  0%   { transform: scale(0); opacity: 0; }
  55%  { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.spawning {
  animation: spawnPop 0.45s cubic-bezier(.17,.67,.55,1.4) forwards;
}

/* survival flash */
@keyframes survivalFlicker {
  0%, 100% { filter: brightness(1); }
  50%       { filter: brightness(1.6) saturate(2); }
}
.survival-mode .creature-sprite {
  animation: survivalFlicker 0.35s ease-in-out infinite;
}

/* death shrink */
@keyframes deathShrink {
  0%   { opacity: 1; transform: scale(1); }
  30%  { opacity: 1; transform: scale(1.4); filter: brightness(3) saturate(0); }
  100% { opacity: 0; transform: scale(0); }
}
.dying-anim {
  animation: deathShrink 0.8s ease-in forwards !important;
  pointer-events: none;
}

/* reproduction flash */
@keyframes reproFlash {
  0%   { filter: brightness(1); }
  20%  { filter: brightness(6) saturate(0) invert(1); }
  50%  { filter: brightness(3) hue-rotate(120deg); }
  100% { filter: brightness(1); opacity: 0; }
}
.repro-anim {
  animation: reproFlash 0.9s ease-out forwards !important;
  pointer-events: none;
}

/* pixel explosion particles */
@keyframes pixelFly {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(0.5); }
}
.explosion-px {
  position: fixed;
  width: 4px; height: 4px;
  pointer-events: none;
  z-index: 30;
  animation: pixelFly 0.7s ease-out forwards;
}

/* floating popup text */
.pixel-floater {
  position: fixed;
  font-size: 7px;
  pointer-events: none;
  z-index: 40;
  white-space: nowrap;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
  animation: floatUp 2.2s ease-out forwards;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translateX(-50%) translateY(0); }
  15%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-56px); }
}

/* tooltip */
#tip {
  position: fixed;
  z-index: 50;
  background: #04040e;
  border: 2px solid var(--green);
  box-shadow: 3px 3px 0 rgba(0,238,119,0.2);
  padding: 8px 10px;
  font-size: 6px;
  line-height: 2.2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  min-width: 160px;
}
#tip.show { opacity: 1; }
#tip .tt-head {
  font-size: 7px;
  color: var(--green);
  text-shadow: 0 0 6px var(--green);
  margin-bottom: 5px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--green-dark);
}
#tip .tt-row { display: flex; justify-content: space-between; gap: 14px; color: rgba(0,238,119,0.55); }
#tip .tt-row .v { color: var(--white); }
</style>
</head>
<body>
<div id="grid-bg"></div>
<div id="scanlines"></div>

<div id="world">
  <div id="gaia-zone">
    <div id="gaia-sprite"></div>
    <div id="gaia-name">★ GAIA ★</div>
    <div class="gaia-stat-line" id="gaia-mode-line">MODE: <span id="gaia-mode">STABLE</span></div>
    <div class="gaia-stat-line">GEN <span id="gaia-gen">1</span> &nbsp;|&nbsp; COLONY <span id="gaia-pop">0</span>/12</div>
  </div>
</div>

<div id="hud">
  <div id="gen-display" class="pixel-panel">
    <div id="gen-number">GEN 1</div>
  </div>

  <div id="stats-left" class="pixel-panel">
    <div class="stat-row">ALIVE     <span class="val" id="s-alive">0</span></div>
    <div class="stat-row">DEAD      <span class="val" id="s-dead">0</span></div>
    <div class="stat-row">BORN      <span class="val" id="s-repro">0</span></div>
  </div>

  <div id="stats-right" class="pixel-panel">
    <div class="stat-row">EARNED    <span class="val" id="s-earned">$0.0000</span></div>
    <div class="stat-row">EMERGENCY <span class="val" id="s-emerg">0</span></div>
    <div class="stat-row">UPTIME    <span class="val" id="s-uptime">0m</span></div>
  </div>

  <div id="balance-box" class="pixel-panel">
    <div id="balance-amount">$-.----</div>
    <div id="balance-label">TOTAL USDC</div>
    <div id="bal-breakdown">
      <div class="bal-row" id="br-m-kite">MTH KITE  <span class="bv">—</span></div>
      <div class="bal-row" id="br-m-base">MTH BASE  <span class="bv">—</span></div>
      <div class="bal-row" id="br-m-poly">MTH POLY  <span class="bv">—</span></div>
      <div class="bal-divider"></div>
      <div class="bal-row" id="br-c-kite">COL KITE  <span class="bv">—</span></div>
      <div class="bal-row" id="br-c-poly">COL POLY  <span class="bv">—</span></div>
    </div>
  </div>

  <div id="event-log">
    <span id="event-log-title">// EVENT LOG</span>
  </div>
</div>

<div id="tip">
  <div class="tt-head" id="tt-id">-</div>
  <div class="tt-row">FITNESS   <span class="v" id="tt-fit">-</span></div>
  <div class="tt-row">TIME LEFT <span class="v" id="tt-hrs">-</span></div>
  <div class="tt-row">EARNED    <span class="v" id="tt-earn">-</span></div>
  <div class="tt-row">TASKS     <span class="v" id="tt-tasks">-</span></div>
  <div class="tt-row">SPEC      <span class="v" id="tt-spec">-</span></div>
  <div class="tt-row">DESP      <span class="v" id="tt-desp">-</span></div>
  <div class="tt-row">WTL       <span class="v" id="tt-wtl">-</span></div>
  <div class="tt-row">CLAW      <span class="v" id="tt-claw">-</span></div>
  <div class="tt-row" style="font-size:5px;margin-top:4px;border-top:1px solid #003322;padding-top:4px">
    WALLET <span class="v" id="tt-wallet" style="font-size:5px;word-break:break-all">-</span>
  </div>
  <div class="tt-row" style="font-size:5px;margin-top:2px">
    KITE   <span class="v" id="tt-kite" style="font-size:5px;word-break:break-all">-</span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const PS = 4  // pixels per map-cell for children (32px / 8 = 4)
const PS2 = 4 // pixels per map-cell for GAIA (64px / 16 = 4)
const BASE_SPEED = 0.8
const SURVIVAL_SPEED_MULT = 2.8

// ═══════════════════════════════════════════════════════════════
// PIXEL ART MAPS
// ═══════════════════════════════════════════════════════════════

// Format: rows of strings, '0'=transparent, '1'=main, '2'=dark/detail, '3'=accent
const CREATURE_MAPS = {
  generalist: [
    '00111000',
    '01111100',
    '11111110',
    '11211210',
    '11111110',
    '01131100',
    '00111000',
    '00000000',
  ],
  content: [
    '00011000',
    '00311100',
    '01111110',
    '11211110',
    '01111100',
    '00311000',
    '00011100',
    '00000000',
  ],
  tech: [
    '00010000',
    '01111100',
    '11111110',
    '12111210',
    '11111110',
    '01131100',
    '01000100',
    '00000000',
  ],
  business: [
    '01111100',
    '11111110',
    '00111000',
    '00211200',
    '00111000',
    '03111300',
    '00111000',
    '00000000',
  ],
  research: [
    '00111000',
    '01111100',
    '12211210',
    '12111210',
    '01111100',
    '03333300',
    '00101000',
    '00000000',
  ],
  crypto: [
    '00111000',
    '01111100',
    '11211210',
    '11311310',
    '11311310',
    '11211210',
    '01111100',
    '00111000',
  ],
}

const CREATURE_COLORS = {
  generalist: { '1': '#ddeeff', '2': '#334466', '3': '#ff4444' },
  content:    { '1': '#4488ff', '2': '#001133', '3': '#ffcc00' },
  tech:       { '1': '#99aacc', '2': '#88ddff', '3': '#223344' },
  business:   { '1': '#ff8833', '2': '#221100', '3': '#993311' },
  research:   { '1': '#cc66ff', '2': '#440066', '3': '#ffffff' },
  crypto:     { '1': '#ffdd00', '2': '#cc6600', '3': '#886600' },
}

const SURVIVAL_COLORS = { '1': '#ff3344', '2': '#220000', '3': '#ff8800' }

// GAIA 16×16 at PS2 per cell = 64×64
const GAIA_MAP = [
  '0000011110000000',
  '0001111111100000',
  '0011111111110000',
  '0111111111111000',
  '0112211111221100',
  '1111221111221111',
  '1111111111111111',
  '1111111111111111',
  '1111111111111111',
  '1111111331111111',
  '0111113333311110',
  '0111111111111110',
  '0011111111111100',
  '0001111111110000',
  '0000111111100000',
  '0000011110000000',
]
const GAIA_COLORS = { '1': '#00ee77', '2': '#002211', '3': '#001108' }
const GAIA_STRUGGLING_COLORS = { '1': '#ffcc00', '2': '#221100', '3': '#110000' }
const GAIA_DYING_COLORS      = { '1': '#884422', '2': '#220800', '3': '#110000' }
const GAIA_THRIVING_COLORS   = { '1': '#44ffaa', '2': '#003322', '3': '#001108' }

// ═══════════════════════════════════════════════════════════════
// SVG PIXEL ART BUILDER
// ═══════════════════════════════════════════════════════════════

function buildSVG(map, colorMap, cellPx) {
  const cols = map[0].length
  const rows = map.length
  const w = cols * cellPx
  const h = rows * cellPx
  let rects = ''
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = map[r][c]
      if (ch !== '0' && colorMap[ch]) {
        rects += `<rect x="${c * cellPx}" y="${r * cellPx}" width="${cellPx}" height="${cellPx}" fill="${colorMap[ch]}"/>`
      }
    }
  }
  return `<svg width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${rects}</svg>`
}

function setSVG(el, map, colorMap, cellPx) {
  el.innerHTML = buildSVG(map, colorMap, cellPx)
}

// ═══════════════════════════════════════════════════════════════
// GAIA MOTHER RENDERER
// ═══════════════════════════════════════════════════════════════

let lastGaiaMode = 'stable'

function renderGaia(mode) {
  if (mode === lastGaiaMode) return
  lastGaiaMode = mode
  const el = document.getElementById('gaia-sprite')
  let colors = GAIA_COLORS
  if (mode === 'dying' || mode === 'critical') colors = GAIA_DYING_COLORS
  else if (mode === 'survival' || mode === 'unstable') colors = GAIA_STRUGGLING_COLORS
  else if (mode === 'thriving') colors = GAIA_THRIVING_COLORS
  setSVG(el, GAIA_MAP, colors, PS2)
}

// ═══════════════════════════════════════════════════════════════
// CREATURE MOVEMENT ENGINE
// ═══════════════════════════════════════════════════════════════

let W = window.innerWidth
let H = window.innerHeight
const GAIA_ZONE_BOTTOM = 260  // creatures stay below this
const LOG_HEIGHT = 82
const EDGE = 10

const creatures = new Map()  // id -> { el, x, y, vx, vy, data }

function randomVelocity(speed) {
  const angle = Math.random() * Math.PI * 2
  return { vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed }
}

function spawnCreature(child) {
  if (creatures.has(child.id)) return

  const spec = child.genome?.specialization || 'generalist'
  const colorMap = child.survivalMode ? SURVIVAL_COLORS : (CREATURE_COLORS[spec] || CREATURE_COLORS.generalist)
  const map = CREATURE_MAPS[spec] || CREATURE_MAPS.generalist

  // Starting position: random in safe zone, clear of GAIA
  const x = EDGE + 32 + Math.random() * (W - EDGE * 2 - 64)
  const y = GAIA_ZONE_BOTTOM + Math.random() * (H - GAIA_ZONE_BOTTOM - LOG_HEIGHT - 64)
  const { vx, vy } = randomVelocity(BASE_SPEED)

  // Build DOM
  const wrap = document.createElement('div')
  wrap.className = 'creature-wrap spawning'
  wrap.id = 'cw-' + child.id.replace(/[^a-z0-9]/gi, '-')

  const svgEl = document.createElement('div')
  svgEl.className = 'creature-sprite'
  svgEl.innerHTML = buildSVG(map, colorMap, PS)

  const hpBg = document.createElement('div')
  hpBg.className = 'hp-bar-bg'
  const hpFill = document.createElement('div')
  hpFill.className = 'hp-bar-fill'
  hpBg.appendChild(hpFill)

  const label = document.createElement('div')
  label.className = 'creature-id'
  label.textContent = child.id.replace('GAIA-', '')

  wrap.appendChild(svgEl)
  wrap.appendChild(hpBg)
  wrap.appendChild(label)
  document.body.appendChild(wrap)

  wrap.style.left = x + 'px'
  wrap.style.top  = y + 'px'

  attachTip(wrap, child)

  creatures.set(child.id, { el: wrap, svgEl, hpFill, x, y, vx, vy, data: child })
}

function updateCreature(child) {
  const c = creatures.get(child.id)
  if (!c) return
  c.data = child

  // Update sprite colors for survival mode
  const spec = child.genome?.specialization || 'generalist'
  const colorMap = child.survivalMode ? SURVIVAL_COLORS : (CREATURE_COLORS[spec] || CREATURE_COLORS.generalist)
  c.svgEl.innerHTML = buildSVG(CREATURE_MAPS[spec] || CREATURE_MAPS.generalist, colorMap, PS)

  if (child.survivalMode) {
    c.el.classList.add('survival-mode')
  } else {
    c.el.classList.remove('survival-mode')
  }

  // Health bar
  const fit = child.fitness || 0
  const pct = Math.min(100, Math.max(0, fit * 50))  // 2.0 fitness = 100%
  c.hpFill.style.width = pct + '%'
  c.hpFill.className = 'hp-bar-fill' +
    (fit < 0.3 ? ' low' : fit < 1.0 ? ' med' : '')

  // Adjust speed
  c.speed = child.survivalMode ? BASE_SPEED * SURVIVAL_SPEED_MULT : BASE_SPEED
}

function removeCreature(id, anim) {
  const c = creatures.get(id)
  if (!c) return
  c.el.classList.remove('spawning', 'survival-mode')
  c.el.classList.add(anim === 'dying' ? 'dying-anim' : 'repro-anim')

  if (anim === 'dying') {
    spawnExplosion(c.x + 16, c.y + 16, c.data?.genome?.specialization)
  }

  setTimeout(() => {
    c.el.remove()
    creatures.delete(id)
  }, 1000)
}

// ═══════════════════════════════════════════════════════════════
// PIXEL EXPLOSION
// ═══════════════════════════════════════════════════════════════

const EXPLOSION_COLORS = ['#ff3344','#ff8800','#ffcc00','#ff4488','#ff6655']

function spawnExplosion(cx, cy, spec) {
  const baseColor = spec ? (CREATURE_COLORS[spec] || CREATURE_COLORS.generalist)['1'] : '#ff3344'
  const colors = [baseColor, ...EXPLOSION_COLORS]
  for (let i = 0; i < 16; i++) {
    const px = document.createElement('div')
    px.className = 'explosion-px'
    const angle = (i / 16) * Math.PI * 2 + (Math.random() - 0.5) * 0.4
    const dist = 24 + Math.random() * 40
    const dx = Math.round(Math.cos(angle) * dist)
    const dy = Math.round(Math.sin(angle) * dist)
    px.style.cssText = `
      left: ${cx}px; top: ${cy}px;
      background: ${colors[i % colors.length]};
      --dx: ${dx}px; --dy: ${dy}px;
      animation-duration: ${0.4 + Math.random() * 0.4}s;
    `
    document.body.appendChild(px)
    setTimeout(() => px.remove(), 900)
  }
}

// ═══════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════

let lastFrameTime = 0

function animLoop(ts) {
  const dt = Math.min((ts - lastFrameTime) / 16.67, 3)  // delta in ~frames, capped
  lastFrameTime = ts

  for (const [, c] of creatures) {
    const speed = c.speed || BASE_SPEED
    const jitter = (Math.random() - 0.5) * 0.06  // slight random wander

    c.vx += jitter
    c.vy += jitter

    // Normalize to maintain speed
    const mag = Math.sqrt(c.vx * c.vx + c.vy * c.vy)
    if (mag > 0) {
      c.vx = (c.vx / mag) * speed
      c.vy = (c.vy / mag) * speed
    }

    c.x += c.vx * dt
    c.y += c.vy * dt

    // Bounce off edges
    const minX = EDGE, maxX = W - EDGE - 32
    const minY = GAIA_ZONE_BOTTOM, maxY = H - LOG_HEIGHT - EDGE - 48

    if (c.x < minX) { c.x = minX; c.vx = Math.abs(c.vx) }
    if (c.x > maxX) { c.x = maxX; c.vx = -Math.abs(c.vx) }
    if (c.y < minY) { c.y = minY; c.vy = Math.abs(c.vy) }
    if (c.y > maxY) { c.y = maxY; c.vy = -Math.abs(c.vy) }

    c.el.style.left = Math.round(c.x) + 'px'
    c.el.style.top  = Math.round(c.y) + 'px'
  }

  requestAnimationFrame(animLoop)
}

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════

const tip = document.getElementById('tip')
let tipTarget = null

document.addEventListener('mousemove', e => {
  if (!tipTarget) return
  let tx = e.clientX + 14, ty = e.clientY - 8
  if (tx + 180 > W) tx = e.clientX - 194
  if (ty + 140 > H) ty = e.clientY - 148
  tip.style.left = tx + 'px'
  tip.style.top  = ty + 'px'
})

function attachTip(el, child) {
  el.addEventListener('mouseenter', () => {
    tipTarget = child.id
    const c = creatures.get(child.id)
    const d = c ? c.data : child
    document.getElementById('tt-id').textContent    = d.id
    document.getElementById('tt-fit').textContent   = (d.fitness || 0).toFixed(4)
    document.getElementById('tt-hrs').textContent   = (d.hoursRemaining || 0).toFixed(1) + 'h'
    document.getElementById('tt-earn').textContent  = '$' + (d.totalEarned || 0).toFixed(4)
    document.getElementById('tt-tasks').textContent = d.tasks || 0
    document.getElementById('tt-spec').textContent  = d.genome?.specialization || '?'
    document.getElementById('tt-desp').textContent  = (d.desperationLevel || 0) + '/10'
    document.getElementById('tt-wtl').textContent   = (d.willToLive || 0).toFixed(4)
    document.getElementById('tt-claw').textContent  = d.hasClaw ? '✓ ACTIVE' : '— none'
    document.getElementById('tt-wallet').textContent = d.walletAddress ? d.walletAddress.slice(0,18) + '…' : 'deriving…'
    document.getElementById('tt-kite').textContent   = d.kiteAgentId || 'pending…'
    tip.classList.add('show')
  })
  el.addEventListener('mouseleave', () => {
    tipTarget = null
    tip.classList.remove('show')
  })
}

// ═══════════════════════════════════════════════════════════════
// FLOATING TEXT POPUPS
// ═══════════════════════════════════════════════════════════════

function floater(text, x, y, color) {
  const d = document.createElement('div')
  d.className = 'pixel-floater'
  d.textContent = text
  d.style.cssText = `left:${x}px; top:${y}px; color:${color};`
  document.body.appendChild(d)
  setTimeout(() => d.remove(), 2500)
}

// ═══════════════════════════════════════════════════════════════
// HUD UPDATE
// ═══════════════════════════════════════════════════════════════

function updateHUD(data) {
  const gen = data.generation || 1
  document.getElementById('gen-number').textContent = 'GEN ' + gen
  document.getElementById('gaia-gen').textContent   = gen
  document.getElementById('gaia-pop').textContent   = data.alive || 0
  document.getElementById('s-alive').textContent    = data.alive || 0
  document.getElementById('s-dead').textContent     = data.terminated || 0
  document.getElementById('s-repro').textContent    = data.reproduced || 0
  document.getElementById('s-earned').textContent   = '$' + (data.totalEarned || 0).toFixed(4)
  document.getElementById('s-emerg').textContent    = data.emergencyRequests || 0

  if (data.genesisTime) {
    const upMin = Math.floor((Date.now() - data.genesisTime) / 60000)
    document.getElementById('s-uptime').textContent = upMin < 60
      ? upMin + 'm'
      : Math.floor(upMin / 60) + 'h ' + (upMin % 60) + 'm'
  }

  // Derive GAIA mode from children
  let mode = 'stable'
  const children = data.children || []
  const alive = children.filter(c => c.status === 'alive')
  if (alive.length === 0) {
    mode = 'dying'
  } else {
    const inSurvival = alive.filter(c => c.survivalMode).length
    if (inSurvival > alive.length * 0.5) mode = 'survival'
    else if (data.totalEarned > 3) mode = 'thriving'
  }
  document.getElementById('gaia-mode').textContent = mode.toUpperCase()
  renderGaia(mode)
}

// ═══════════════════════════════════════════════════════════════
// EVENT LOG
// ═══════════════════════════════════════════════════════════════

let shownEvents = new Set()

function renderEvents(events) {
  const log = document.getElementById('event-log')
  const lines = events.slice(0, 6)

  // Remove old log lines (keep the title span)
  const title = document.getElementById('event-log-title')
  log.innerHTML = ''
  log.appendChild(title)

  for (const ev of lines) {
    const d = document.createElement('div')
    d.className = 'log-line ' + (ev.type || 'info')
    d.textContent = ev.time + ' > ' + ev.msg
    log.appendChild(d)
  }

  // Floaters for new events
  for (const ev of events.slice(0, 3)) {
    const key = ev.time + ev.msg
    if (shownEvents.has(key)) continue
    shownEvents.add(key)
    if (shownEvents.size > 300) shownEvents = new Set([...shownEvents].slice(-150))

    const fx = W * 0.15 + Math.random() * W * 0.7
    const fy = H * 0.35 + Math.random() * H * 0.25
    const colors = { danger: '#ff5566', success: '#44ffaa', warn: '#ffcc44', info: '#55aaff' }
    floater(ev.msg.slice(0, 48), fx, fy, colors[ev.type] || '#aaffcc')
  }
}

// ═══════════════════════════════════════════════════════════════
// COLONY FETCH & SYNC
// ═══════════════════════════════════════════════════════════════

let prevChildren = {}

async function fetchColony() {
  let data
  try {
    const r = await fetch('/colony')
    data = await r.json()
  } catch (_) {
    setTimeout(fetchColony, 5000)
    return
  }

  updateHUD(data)
  renderEvents(data.events || [])

  const children = data.children || []
  const aliveIds = new Set()

  for (const child of children) {
    if (child.status !== 'alive') continue
    aliveIds.add(child.id)

    if (!creatures.has(child.id)) {
      spawnCreature(child)
      floater('SPAWNED!', W * 0.3 + Math.random() * W * 0.4, H * 0.5, '#44ffcc')
    } else {
      updateCreature(child)
    }
  }

  // Handle transitions (alive -> terminated/reproduced)
  for (const child of children) {
    const prev = prevChildren[child.id]
    if (prev && prev.status === 'alive' && child.status !== 'alive') {
      if (creatures.has(child.id)) {
        const c = creatures.get(child.id)
        const pos = { x: c.x + 16, y: c.y + 16 }
        if (child.status === 'terminated') {
          removeCreature(child.id, 'dying')
          floater('TERMINATED', pos.x, pos.y - 20, '#ff4455')
        } else if (child.status === 'reproduced') {
          removeCreature(child.id, 'repro')
          floater('REPRODUCED!', pos.x, pos.y - 20, '#ffffff')
          // Spawn offspring hint floater
          setTimeout(() => floater('NEW LIFE!', pos.x + (Math.random()-0.5)*60, pos.y - 50, '#44ffaa'), 500)
        }
      }
    }
  }

  // Clean up creatures no longer in data
  for (const [id] of creatures) {
    if (!aliveIds.has(id)) {
      removeCreature(id, 'dying')
    }
  }

  // Build prev map
  prevChildren = {}
  for (const child of children) prevChildren[child.id] = child

  setTimeout(fetchColony, 5000)
}

// ═══════════════════════════════════════════════════════════════
// BALANCE FETCH
// ═══════════════════════════════════════════════════════════════

function setBalRow(id, value) {
  const row = document.getElementById(id)
  if (!row) return
  const span = row.querySelector('.bv')
  if (value == null) {
    span.textContent = '—'
    row.classList.add('bal-null')
  } else {
    span.textContent = '$' + value.toFixed(4)
    row.classList.remove('bal-null')
  }
}

async function fetchBalance() {
  try {
    const r = await fetch('/colony/balances')
    if (!r.ok) return
    const d = await r.json()

    // Total
    document.getElementById('balance-amount').textContent =
      '$' + (d.totals?.all ?? 0).toFixed(4)

    // Mother breakdown
    setBalRow('br-m-kite', d.mother?.kite   ?? null)
    setBalRow('br-m-base', d.mother?.base   ?? null)
    setBalRow('br-m-poly', d.mother?.polygon ?? null)

    // Colony totals
    const childKite = (d.children || []).reduce((s, c) => s + (c.kite || 0), 0)
    const childPoly = (d.children || []).reduce((s, c) => s + (c.poly || 0), 0)
    setBalRow('br-c-kite', childKite)
    setBalRow('br-c-poly', childPoly)
  } catch (_) {}
}

window.addEventListener('resize', () => {
  W = window.innerWidth
  H = window.innerHeight
})

// Render initial GAIA
setSVG(document.getElementById('gaia-sprite'), GAIA_MAP, GAIA_COLORS, PS2)

// Start loops
requestAnimationFrame(animLoop)
fetchColony()
fetchBalance()
setInterval(fetchBalance, 30000)
</script>
