<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA // Colony</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #050d1a;
  --bg2:       #070f20;
  --gaia-core: #00ff88;
  --gaia-glow: #00cc66;
  --teal:      #00e5cc;
  --amber:     #ffaa00;
  --red:       #ff3344;
  --white:     #e8f8ff;
  --dim:       rgba(0,255,136,0.15);
  --font-main: 'Orbitron', monospace;
  --font-mono: 'Share Tech Mono', monospace;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-mono);
  overflow: hidden;
}

/* ── Canvas layer ─────────────────────────────────────────── */
#cosmos {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Organism scene ───────────────────────────────────────── */
#scene {
  position: fixed; inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ── SVG connections ──────────────────────────────────────── */
#connections {
  position: fixed; inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* ── Organisms ────────────────────────────────────────────── */
.organism {
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: all;
  cursor: pointer;
  transition: filter 0.6s, box-shadow 0.6s;
}

/* GAIA mother */
#gaia-organism {
  z-index: 10;
  border-radius: 50%;
}

.gaia-core {
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%,
    #a0ffcc 0%, #00ff88 30%, #00cc55 60%, #005522 100%);
  box-shadow:
    0 0 40px 20px rgba(0,255,136,0.5),
    0 0 80px 40px rgba(0,255,136,0.25),
    0 0 160px 80px rgba(0,204,102,0.1);
  animation: gaiaBreath 4s ease-in-out infinite;
}

@keyframes gaiaBreath {
  0%, 100% { transform: scale(1);   box-shadow: 0 0 40px 20px rgba(0,255,136,0.5), 0 0 80px 40px rgba(0,255,136,0.25), 0 0 160px 80px rgba(0,204,102,0.1); }
  50%       { transform: scale(1.08); box-shadow: 0 0 60px 30px rgba(0,255,136,0.7), 0 0 120px 60px rgba(0,255,136,0.35), 0 0 220px 100px rgba(0,204,102,0.18); }
}

.gaia-ring {
  position: absolute; border-radius: 50%;
  border: 1px solid rgba(0,255,136,0.2);
  animation: ringPulse 4s ease-in-out infinite;
  pointer-events: none;
}
.gaia-ring:nth-child(1) { animation-delay: 0s; }
.gaia-ring:nth-child(2) { animation-delay: 1s; }
.gaia-ring:nth-child(3) { animation-delay: 2s; }

@keyframes ringPulse {
  0%   { opacity: 0.7; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0;   transform: translate(-50%,-50%) scale(2.5); }
}

/* Child organisms */
.child-organism {
  z-index: 8;
  border-radius: 50%;
  animation: childFloat 6s ease-in-out infinite;
}

@keyframes childFloat {
  0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
  50%       { transform: translate(-50%, -50%) translateY(-8px); }
}

.child-body {
  width: 100%; height: 100%;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
}

.child-membrane {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.4);
  animation: membranePulse 3s ease-in-out infinite;
}

@keyframes membranePulse {
  0%, 100% { transform: scale(1);    opacity: 0.6; }
  50%       { transform: scale(1.06); opacity: 1; }
}

.child-nucleus {
  position: absolute;
  width: 35%; height: 35%;
  border-radius: 50%;
  top: 30%; left: 32%;
  background: rgba(255,255,255,0.6);
  filter: blur(2px);
}

.child-label {
  position: absolute;
  bottom: -22px; left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: rgba(255,255,255,0.7);
  white-space: nowrap;
  font-family: var(--font-mono);
  letter-spacing: 1px;
}

/* Survival shake */
.survival-shake {
  animation: childFloat 6s ease-in-out infinite, survivalShake 0.3s ease-in-out infinite !important;
}

@keyframes survivalShake {
  0%, 100% { margin-left: 0; }
  25%       { margin-left: -3px; }
  75%       { margin-left: 3px; }
}

/* Termination death */
.dying {
  animation: deathShrink 1.5s ease-in forwards !important;
}
@keyframes deathShrink {
  0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  30%  { opacity: 1; transform: translate(-50%,-50%) scale(1.3); filter: brightness(3) saturate(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(0); }
}

/* Reproduction flash */
.reproducing {
  animation: reproFlash 1s ease-out forwards !important;
}
@keyframes reproFlash {
  0%   { filter: brightness(1); }
  30%  { filter: brightness(8) hue-rotate(60deg); }
  60%  { filter: brightness(3); }
  100% { filter: brightness(1); opacity: 0.3; }
}

/* ── HUD Overlays ─────────────────────────────────────────── */
#hud {
  position: fixed; inset: 0;
  z-index: 20;
  pointer-events: none;
}

/* Top center gen counter */
#gen-display {
  position: absolute;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}
#gen-number {
  font-family: var(--font-main);
  font-size: 48px;
  font-weight: 900;
  color: var(--gaia-core);
  text-shadow: 0 0 20px var(--gaia-core), 0 0 40px rgba(0,255,136,0.5);
  line-height: 1;
  letter-spacing: 4px;
}
#gen-label {
  font-size: 10px;
  letter-spacing: 6px;
  color: rgba(0,255,136,0.6);
  text-transform: uppercase;
  margin-top: 2px;
}

/* Top left stats */
#stats-left {
  position: absolute;
  top: 24px; left: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

/* Top right stats */
#stats-right {
  position: absolute;
  top: 24px; right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: right;
  pointer-events: none;
}

.stat-chip {
  background: rgba(5,13,26,0.8);
  border: 1px solid rgba(0,255,136,0.2);
  border-radius: 4px;
  padding: 6px 12px;
  font-size: 11px;
  color: rgba(0,255,136,0.8);
  letter-spacing: 1px;
  backdrop-filter: blur(8px);
}
.stat-chip span {
  color: var(--white);
  font-weight: bold;
  margin-left: 6px;
}

/* Bottom event feed */
#event-feed {
  position: absolute;
  bottom: 24px; left: 24px;
  display: flex;
  flex-direction: column-reverse;
  gap: 4px;
  pointer-events: none;
  max-width: 400px;
}

.event-line {
  font-size: 11px;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 2px;
  animation: eventFadeIn 0.4s ease-out;
  background: rgba(5,13,26,0.7);
  border-left: 2px solid var(--gaia-core);
}
.event-line.danger { border-left-color: var(--red); color: #ff8899; }
.event-line.success { border-left-color: var(--gaia-core); color: #88ffcc; }
.event-line.warn { border-left-color: var(--amber); color: #ffcc66; }
.event-line.info { border-left-color: var(--teal); color: #88eeff; }

@keyframes eventFadeIn {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* Bottom right balance */
#balance-display {
  position: absolute;
  bottom: 24px; right: 24px;
  text-align: right;
  pointer-events: none;
}
#balance-amount {
  font-family: var(--font-main);
  font-size: 28px;
  font-weight: 700;
  color: var(--gaia-core);
  text-shadow: 0 0 12px var(--gaia-core);
  letter-spacing: 2px;
}
#balance-label {
  font-size: 9px;
  letter-spacing: 4px;
  color: rgba(0,255,136,0.5);
  text-transform: uppercase;
}

/* Floating event popups */
#floaters {
  position: fixed; inset: 0;
  z-index: 30;
  pointer-events: none;
}

.floater {
  position: absolute;
  font-size: 13px;
  font-family: var(--font-mono);
  letter-spacing: 1px;
  pointer-events: none;
  animation: floatUp 3s ease-out forwards;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(0) translateX(-50%); }
  15%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(-80px) translateX(-50%); }
}

/* Tooltip */
#tooltip {
  position: fixed;
  z-index: 50;
  background: rgba(5,13,26,0.95);
  border: 1px solid rgba(0,255,136,0.3);
  border-radius: 6px;
  padding: 12px 16px;
  font-size: 11px;
  line-height: 1.8;
  color: var(--white);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  max-width: 220px;
  backdrop-filter: blur(12px);
}
#tooltip.visible { opacity: 1; }
#tooltip .tt-id { color: var(--gaia-core); font-size: 12px; letter-spacing: 2px; margin-bottom: 6px; }
#tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; }
#tooltip .tt-key { color: rgba(0,255,136,0.5); }
#tooltip .tt-val { color: var(--white); }

/* ── Particle canvas ──────────────────────────────────────── */
/* handled in JS */
</style>
</head>
<body>

<canvas id="cosmos"></canvas>
<svg id="connections"></svg>
<div id="scene">
  <div id="gaia-organism" class="organism">
    <div class="gaia-ring" style="width:160%;height:160%;position:absolute;top:50%;left:50%;margin-left:-80%;margin-top:-80%;"></div>
    <div class="gaia-ring" style="width:220%;height:220%;position:absolute;top:50%;left:50%;margin-left:-110%;margin-top:-110%;"></div>
    <div class="gaia-ring" style="width:300%;height:300%;position:absolute;top:50%;left:50%;margin-left:-150%;margin-top:-150%;"></div>
    <div class="gaia-core" style="width:100%;height:100%;border-radius:50%;"></div>
  </div>
</div>
<div id="floaters"></div>

<div id="hud">
  <div id="gen-display">
    <div id="gen-number">GEN 1</div>
    <div id="gen-label">generation</div>
  </div>

  <div id="stats-left">
    <div class="stat-chip">ALIVE <span id="s-alive">0</span></div>
    <div class="stat-chip">TERMINATED <span id="s-dead">0</span></div>
    <div class="stat-chip">REPRODUCED <span id="s-repro">0</span></div>
  </div>

  <div id="stats-right">
    <div class="stat-chip">EARNED <span id="s-earned">$0.0000</span></div>
    <div class="stat-chip">EMERGENCY <span id="s-emergency">0</span></div>
    <div class="stat-chip">UPTIME <span id="s-uptime">0m</span></div>
  </div>

  <div id="event-feed"></div>

  <div id="balance-display">
    <div id="balance-amount">-.----</div>
    <div id="balance-label">USDC balance</div>
  </div>
</div>

<div id="tooltip">
  <div class="tt-id" id="tt-id"></div>
  <div class="tt-row"><span class="tt-key">fitness</span><span class="tt-val" id="tt-fit"></span></div>
  <div class="tt-row"><span class="tt-key">hours left</span><span class="tt-val" id="tt-hrs"></span></div>
  <div class="tt-row"><span class="tt-key">earned</span><span class="tt-val" id="tt-earn"></span></div>
  <div class="tt-row"><span class="tt-key">tasks</span><span class="tt-val" id="tt-tasks"></span></div>
  <div class="tt-row"><span class="tt-key">spec</span><span class="tt-val" id="tt-spec"></span></div>
  <div class="tt-row"><span class="tt-key">desp</span><span class="tt-val" id="tt-desp"></span></div>
  <div class="tt-row"><span class="tt-key">WTL</span><span class="tt-val" id="tt-wtl"></span></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────
const KITE_RPC   = 'https://rpc.gokite.ai'
const KITE_CHAIN = 2366
const USDC_ADDR  = '0x7aB6f3ed87C42eF0aDb67Ed95090f8bF5240149e'
const GAIA_ADDR  = '0x9BeD7776262076B016798d6Ee74Dea3a6B1Ac662'

const SPEC_COLORS = {
  content:  { h: 140, s: 80, l: 50 },
  tech:     { h: 210, s: 80, l: 55 },
  business: { h: 30,  s: 90, l: 55 },
  research: { h: 270, s: 70, l: 60 },
  default:  { h: 170, s: 70, l: 50 },
}

function specColor(spec, alpha = 1) {
  const c = SPEC_COLORS[spec] || SPEC_COLORS.default
  return `hsla(${c.h},${c.s}%,${c.l}%,${alpha})`
}

function specGlow(spec) {
  const c = SPEC_COLORS[spec] || SPEC_COLORS.default
  return `hsla(${c.h},${c.s}%,${c.l}%,0.8)`
}

// ── Particle system ────────────────────────────────────────────
const canvas = document.getElementById('cosmos')
const ctx    = canvas.getContext('2d')
let W, H, particles = []

function resizeCanvas() {
  W = canvas.width  = window.innerWidth
  H = canvas.height = window.innerHeight
}

function initParticles(n = 120) {
  particles = []
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      hue: Math.random() < 0.5 ? 150 + Math.random() * 40 : 190 + Math.random() * 30,
      alpha: Math.random() * 0.6 + 0.1,
    })
  }
}

function drawParticles() {
  ctx.clearRect(0, 0, W, H)

  // deep space gradient
  const grad = ctx.createRadialGradient(W/2, H*0.35, 0, W/2, H/2, Math.max(W,H)*0.8)
  grad.addColorStop(0,   'rgba(5,20,40,1)')
  grad.addColorStop(0.5, 'rgba(5,13,26,1)')
  grad.addColorStop(1,   'rgba(2,6,14,1)')
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, W, H)

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy
    if (p.x < 0) p.x = W
    if (p.x > W) p.x = 0
    if (p.y < 0) p.y = H
    if (p.y > H) p.y = 0

    ctx.beginPath()
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2)
    ctx.fillStyle = `hsla(${p.hue},80%,70%,${p.alpha})`
    ctx.fill()
  }
}

// ── Organism positioning ───────────────────────────────────────
let gaiaPos = { x: 0, y: 0 }
let childPositions = {}  // id -> {x, y, targetX, targetY}
let prevColonyData  = null

function gaiaSize(colonyData) {
  const alive = colonyData ? colonyData.alive : 0
  const base = Math.min(W, H) * 0.12
  return Math.max(80, Math.min(180, base + alive * 8))
}

function placeGaia(colonyData) {
  gaiaPos.x = W / 2
  gaiaPos.y = H * 0.28
  const sz = gaiaSize(colonyData)
  const el = document.getElementById('gaia-organism')
  el.style.left   = gaiaPos.x + 'px'
  el.style.top    = gaiaPos.y + 'px'
  el.style.width  = sz + 'px'
  el.style.height = sz + 'px'

  // Adjust glow based on colony health
  let mode = 'stable'
  if (colonyData) {
    const inSurvival = (colonyData.children || []).filter(c => c.survivalMode && c.status === 'alive').length
    const alive = colonyData.alive || 0
    if (alive === 0) mode = 'dying'
    else if (inSurvival > alive * 0.5) mode = 'struggling'
    else if (colonyData.totalEarned > 1) mode = 'thriving'
  }
  const core = el.querySelector('.gaia-core')
  if (mode === 'dying') {
    core.style.background = 'radial-gradient(circle at 40% 35%, #886644 0%, #553311 50%, #221100 100%)'
    core.style.boxShadow = '0 0 20px 10px rgba(100,60,0,0.4)'
  } else if (mode === 'struggling') {
    core.style.background = 'radial-gradient(circle at 40% 35%, #ffcc44 0%, #cc8800 40%, #664400 100%)'
    core.style.boxShadow = '0 0 30px 15px rgba(200,120,0,0.5), 0 0 60px 30px rgba(180,100,0,0.2)'
  } else if (mode === 'thriving') {
    core.style.background = 'radial-gradient(circle at 40% 35%, #ffffff 0%, #44ffaa 25%, #00ff88 55%, #003322 100%)'
    core.style.boxShadow = '0 0 60px 30px rgba(0,255,136,0.7), 0 0 120px 60px rgba(0,255,136,0.35), 0 0 220px 100px rgba(0,200,100,0.2)'
  } else {
    core.style.background = ''
    core.style.boxShadow  = ''
  }
}

function assignChildPositions(children) {
  const alive = children.filter(c => c.status === 'alive')
  const n = alive.length
  if (n === 0) return

  const cx = W / 2
  const cy = gaiaPos.y
  const radius = Math.min(W, H) * 0.32

  alive.forEach((child, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2
    const spread = 0.08 * (i % 2 === 0 ? 1 : -1)
    const r = radius * (0.85 + spread)
    const tx = cx + Math.cos(angle) * r
    const ty = cy + H * 0.18 + Math.sin(angle) * r * 0.55

    if (!childPositions[child.id]) {
      childPositions[child.id] = { x: tx, y: ty, tx, ty }
    } else {
      childPositions[child.id].tx = tx
      childPositions[child.id].ty = ty
    }
  })
}

// ── SVG connections ────────────────────────────────────────────
function drawConnections(children) {
  const svg = document.getElementById('connections')
  svg.setAttribute('width', W)
  svg.setAttribute('height', H)
  svg.innerHTML = `<defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`

  const alive = children.filter(c => c.status === 'alive')
  for (const child of alive) {
    const pos = childPositions[child.id]
    if (!pos) continue
    const col = specColor(child.genome?.specialization, 0.5)
    const colBright = specColor(child.genome?.specialization, 0.9)

    // Flowing nutrient path
    const mx = (gaiaPos.x + pos.x) / 2 + (Math.random() * 60 - 30)
    const my = (gaiaPos.y + pos.y) / 2 + (Math.random() * 40 - 20)

    const path = document.createElementNS('http://www.w3.org/2000/svg','path')
    const d = `M ${gaiaPos.x} ${gaiaPos.y} Q ${mx} ${my} ${pos.x} ${pos.y}`
    path.setAttribute('d', d)
    path.setAttribute('fill', 'none')
    path.setAttribute('stroke', child.survivalMode ? 'rgba(255,51,68,0.4)' : col)
    path.setAttribute('stroke-width', child.survivalMode ? '1.5' : '1')
    path.setAttribute('filter', 'url(#glow)')

    // animated dash flow
    const len = 200
    path.setAttribute('stroke-dasharray', `${len} 9999`)
    path.setAttribute('stroke-dashoffset', len)
    const anim = document.createElementNS('http://www.w3.org/2000/svg','animate')
    anim.setAttribute('attributeName','stroke-dashoffset')
    anim.setAttribute('from', len)
    anim.setAttribute('to', `-${len}`)
    anim.setAttribute('dur', child.survivalMode ? '1.2s' : '2.5s')
    anim.setAttribute('repeatCount','indefinite')
    path.appendChild(anim)
    svg.appendChild(path)

    // Static faint line underneath
    const base = document.createElementNS('http://www.w3.org/2000/svg','path')
    base.setAttribute('d', d)
    base.setAttribute('fill', 'none')
    base.setAttribute('stroke', child.survivalMode ? 'rgba(255,51,68,0.1)' : col.replace('0.5','0.12'))
    base.setAttribute('stroke-width', '0.5')
    svg.insertBefore(base, svg.firstChild)
  }
}

// ── Child DOM management ───────────────────────────────────────
const knownChildren = {}

function childOrgSize(fit) {
  return Math.max(36, Math.min(90, 36 + fit * 28))
}

function pulseSpeed(child) {
  if (child.survivalMode) {
    const d = child.desperationLevel || 1
    return Math.max(0.4, 3 - d * 0.25) + 's'
  }
  return '3s'
}

function upsertChild(child) {
  const pos = childPositions[child.id]
  if (!pos) return

  let el = knownChildren[child.id]
  const isNew = !el
  const sz  = childOrgSize(child.fitness)
  const col = specColor(child.genome?.specialization)
  const glow = specGlow(child.genome?.specialization)

  if (isNew) {
    el = document.createElement('div')
    el.className = 'organism child-organism'
    el.id = 'org-' + child.id.replace(/[^a-zA-Z0-9]/g, '-')
    el.innerHTML = `<div class="child-body">
      <div class="child-membrane"></div>
      <div class="child-nucleus"></div>
    </div>
    <div class="child-label">${child.id.replace('GAIA-','')}</div>`
    document.getElementById('scene').appendChild(el)
    knownChildren[child.id] = el

    // Spawn flash
    el.style.opacity = '0'
    el.style.transform = 'translate(-50%,-50%) scale(0)'
    requestAnimationFrame(() => {
      el.style.transition = 'opacity 0.6s, transform 0.6s'
      el.style.opacity = '1'
      el.style.transform = ''
    })
  }

  el.style.left   = pos.x + 'px'
  el.style.top    = pos.y + 'px'
  el.style.width  = sz + 'px'
  el.style.height = sz + 'px'

  const body = el.querySelector('.child-body')
  if (child.survivalMode) {
    body.style.background = `radial-gradient(circle at 35% 30%, #ff8888, #cc2233, #440011)`
    body.style.boxShadow  = `0 0 ${sz*0.4}px ${sz*0.15}px rgba(255,50,70,0.6)`
    el.classList.add('survival-shake')
  } else {
    body.style.background = `radial-gradient(circle at 35% 30%, white, ${col}, ${col.replace('1)','0.4)')})`
    body.style.boxShadow  = `0 0 ${sz*0.3}px ${sz*0.1}px ${glow.replace('0.8','0.5')}`
    el.classList.remove('survival-shake')
  }

  const membrane = el.querySelector('.child-membrane')
  membrane.style.animationDuration = pulseSpeed(child)
  membrane.style.borderColor = child.survivalMode
    ? 'rgba(255,100,100,0.6)' : 'rgba(255,255,255,0.4)'
}

function removeChild(id, animate = 'dying') {
  const el = knownChildren[id]
  if (!el) return
  el.classList.add(animate)
  setTimeout(() => {
    el.remove()
    delete knownChildren[id]
    delete childPositions[id]
  }, 1600)
}

// ── Floating popups ────────────────────────────────────────────
function spawnFloater(text, x, y, color) {
  const div = document.createElement('div')
  div.className = 'floater'
  div.textContent = text
  div.style.left  = x + 'px'
  div.style.top   = y + 'px'
  div.style.color = color
  document.getElementById('floaters').appendChild(div)
  setTimeout(() => div.remove(), 3100)
}

// ── Tooltip ────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip')
let tooltipTarget = null

document.addEventListener('mousemove', e => {
  if (tooltipTarget) {
    let tx = e.clientX + 16, ty = e.clientY - 10
    if (tx + 240 > W) tx = e.clientX - 250
    tooltip.style.left = tx + 'px'
    tooltip.style.top  = ty + 'px'
  }
})

function attachTooltip(el, child) {
  el.addEventListener('mouseenter', () => {
    tooltipTarget = child.id
    document.getElementById('tt-id').textContent   = child.id
    document.getElementById('tt-fit').textContent  = child.fitness?.toFixed(4)
    document.getElementById('tt-hrs').textContent  = child.hoursRemaining?.toFixed(1) + 'h'
    document.getElementById('tt-earn').textContent = '$' + child.totalEarned?.toFixed(4)
    document.getElementById('tt-tasks').textContent = child.tasks
    document.getElementById('tt-spec').textContent  = child.genome?.specialization
    document.getElementById('tt-desp').textContent  = child.desperationLevel + '/10'
    document.getElementById('tt-wtl').textContent   = child.willToLive?.toFixed(4)
    tooltip.classList.add('visible')
  })
  el.addEventListener('mouseleave', () => {
    tooltipTarget = null
    tooltip.classList.remove('visible')
  })
}

// ── Event feed ─────────────────────────────────────────────────
let shownEvents = new Set()

function renderEvents(events) {
  const feed = document.getElementById('event-feed')
  const latest = events.slice(0, 7)
  feed.innerHTML = ''
  for (const ev of latest) {
    const div = document.createElement('div')
    div.className = 'event-line ' + (ev.type || 'info')
    div.textContent = ev.time + ' — ' + ev.msg
    feed.appendChild(div)
  }

  // Spawn floaters for new events
  for (const ev of events.slice(0, 3)) {
    const key = ev.time + ev.msg
    if (shownEvents.has(key)) continue
    shownEvents.add(key)
    if (shownEvents.size > 200) shownEvents = new Set([...shownEvents].slice(-100))

    const fx = W * 0.1 + Math.random() * W * 0.8
    const fy = H * 0.4 + Math.random() * H * 0.3
    const colors = { danger: '#ff4455', success: '#44ffaa', warn: '#ffaa22', info: '#44eeff' }
    spawnFloater(ev.msg.slice(0, 60), fx, fy, colors[ev.type] || '#aaffcc')
  }
}

// ── HUD update ─────────────────────────────────────────────────
function updateHUD(data) {
  document.getElementById('gen-number').textContent = 'GEN ' + (data.generation || 1)
  document.getElementById('s-alive').textContent    = data.alive || 0
  document.getElementById('s-dead').textContent     = data.terminated || 0
  document.getElementById('s-repro').textContent    = data.reproduced || 0
  document.getElementById('s-earned').textContent   = '$' + (data.totalEarned || 0).toFixed(4)
  document.getElementById('s-emergency').textContent = data.emergencyRequests || 0

  if (data.genesisTime) {
    const upMin = Math.floor((Date.now() - data.genesisTime) / 60000)
    document.getElementById('s-uptime').textContent = upMin < 60
      ? upMin + 'm'
      : Math.floor(upMin/60) + 'h ' + (upMin%60) + 'm'
  }
}

// ── Balance fetch ──────────────────────────────────────────────
async function fetchBalance() {
  try {
    const r = await fetch(KITE_RPC, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0', id: 1, method: 'eth_call',
        params: [{ to: USDC_ADDR, data: '0x70a08231000000000000000000000000' + GAIA_ADDR.slice(2) }, 'latest']
      })
    })
    const j = await r.json()
    if (j.result) {
      const raw = parseInt(j.result, 16)
      const bal = (raw / 1e6).toFixed(4)
      document.getElementById('balance-amount').textContent = '$' + bal
    }
  } catch(_) {}
}

// ── Main data fetch & render ───────────────────────────────────
async function fetchColony() {
  let data
  try {
    const r = await fetch('/colony')
    data = await r.json()
  } catch(e) {
    setTimeout(fetchColony, 5000)
    return
  }

  placeGaia(data)
  updateHUD(data)

  const children = data.children || []

  // Detect status changes vs previous
  if (prevColonyData) {
    const prevMap = {}
    for (const c of prevColonyData.children || []) prevMap[c.id] = c

    for (const child of children) {
      const prev = prevMap[child.id]
      if (prev && prev.status === 'alive' && child.status === 'terminated') {
        const pos = childPositions[child.id]
        if (pos) spawnFloater('TERMINATED', pos.x, pos.y - 30, '#ff3344')
        removeChild(child.id, 'dying')
      }
      if (prev && prev.status === 'alive' && child.status === 'reproduced') {
        const pos = childPositions[child.id]
        if (pos) spawnFloater('REPRODUCED', pos.x, pos.y - 30, '#ffffff')
        removeChild(child.id, 'reproducing')
      }
    }

    // New children
    const prevIds = new Set(prevColonyData.children.map(c => c.id))
    for (const child of children) {
      if (!prevIds.has(child.id) && child.status === 'alive') {
        spawnFloater('NEW ORGANISM SPAWNED', W/2, H*0.5, '#44ffcc')
      }
    }
  }

  assignChildPositions(children)

  const alive = children.filter(c => c.status === 'alive')
  for (const child of alive) {
    upsertChild(child)
    const el = knownChildren[child.id]
    if (el) attachTooltip(el, child)
  }

  // Remove DOM nodes for long-gone children
  for (const id of Object.keys(knownChildren)) {
    if (!alive.find(c => c.id === id)) {
      removeChild(id, 'dying')
    }
  }

  drawConnections(alive)
  renderEvents(data.events || [])
  prevColonyData = data

  setTimeout(fetchColony, 5000)
}

// ── Render loop ────────────────────────────────────────────────
function renderLoop() {
  drawParticles()

  // Lerp child positions toward targets
  for (const id of Object.keys(childPositions)) {
    const p = childPositions[id]
    if (p.tx !== undefined) {
      p.x += (p.tx - p.x) * 0.04
      p.y += (p.ty - p.y) * 0.04
    }
    const el = knownChildren[id]
    if (el) {
      el.style.left = p.x + 'px'
      el.style.top  = p.y + 'px'
    }
  }

  requestAnimationFrame(renderLoop)
}

// ── Init ───────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  resizeCanvas()
  initParticles()
  if (prevColonyData) {
    placeGaia(prevColonyData)
    assignChildPositions(prevColonyData.children || [])
  }
})

resizeCanvas()
initParticles()

// place GAIA immediately
placeGaia(null)
const gaiaEl = document.getElementById('gaia-organism')
gaiaEl.style.left   = (W/2) + 'px'
gaiaEl.style.top    = (H*0.28) + 'px'
gaiaEl.style.width  = '120px'
gaiaEl.style.height = '120px'

renderLoop()
fetchColony()
setInterval(fetchBalance, 30000)
fetchBalance()
</script>
